# I/O Mesh TUI — example configuration
# Copy to ~/.iomesh/config.toml and set API keys via environment variables.
#
# SECURITY: prefer env_key over inline api_key. Never commit real secrets.
# --yolo auto-approves write_file and run_shell — use only in trusted sessions.

[models]
default = "deepseek-v4-flash"
temperature = 0.7
max_completion_tokens = 8192
max_retries = 8
# extra_headers = { "X-Request-Tags" = "team=platform,env=dev" }

[router]
max_attempts = 3

# Built-in catalog always present:
#   deepseek-v4-flash → deepseek-v4-pro → grok-4.5  (default auto-cascade)
#   gemini-2.5-flash / gemini-2.5-pro                 (Google AI Studio)
#   vertex-gemini-2.5-flash / vertex-gemini-2.5-pro  (Vertex AI)
#   ollama-llama3.2                                  (local Ollama; pin-only, not cascade)
# Override fields per model as needed; pin with -m / IOMESH_DEFAULT_MODEL:

[model.deepseek-v4-flash]
# model = "deepseek-v4-flash"
# base_url = "https://api.deepseek.com/v1"
env_key = "DEEPSEEK_API_KEY"
# cost_tier = 1
# input_cost_per_m = 0.14
# output_cost_per_m = 0.28
# cache_hit_cost_per_m = 0.0028
# context_window = 1000000
# capabilities = ["fast", "coding", "tool-calling"]
# priority = 10

[model.deepseek-v4-pro]
env_key = "DEEPSEEK_API_KEY"
# priority = 20

[model.grok-4.5]
env_key = "XAI_API_KEY"
# priority = 30

# --- Google Gemini (AI Studio) — OpenAI-compatible ---
# export GEMINI_API_KEY=…   # https://aistudio.google.com/apikey
# iomesh -m gemini-2.5-flash -p "hello"
# [model.gemini-2.5-flash]
# env_key = "GEMINI_API_KEY"
# [model.gemini-2.5-pro]
# env_key = "GEMINI_API_KEY"

# --- Vertex AI Gemini — OpenAI-compatible ---
# export GOOGLE_CLOUD_PROJECT=iomesh-stage-001
# Default: auto token via gcloud auth print-access-token (cached ~50m; 401 retries once)
# Optional: export VERTEX_API_KEY=$(gcloud auth print-access-token) · VERTEX_ADC=0 disables helper
# iomesh -m vertex-gemini-2.5-flash -p "hello"
# Optional region override (default us-central1 in built-in URL):
# [model.vertex-gemini-2.5-flash]
# base_url = "https://us-east4-aiplatform.googleapis.com/v1/projects/${GOOGLE_CLOUD_PROJECT}/locations/us-east4/endpoints/openapi"
# env_key = "VERTEX_API_KEY"
# model = "google/gemini-2.5-flash"

# --- Ollama (local OpenAI-compatible /v1) — pin-only; Beta · not platform GPU ---
# ollama serve && ollama pull llama3.2
# iomesh -m ollama-llama3.2 -p "hello"
# Optional base override: OLLAMA_URL=http://127.0.0.1:11434/v1  or  OLLAMA_HOST=127.0.0.1:11434
# No API key required. Does not replace DeepSeek default cascade.
# [model.ollama-llama3.2]
# model = "llama3.2"
# base_url = "http://127.0.0.1:11434/v1"
# # env_key = ""   # leave unset
# context_window = 128000
# cost_tier = 0
# input_cost_per_m = 0
# output_cost_per_m = 0
# capabilities = ["local", "ollama", "fast", "coding", "tool-calling"]
# priority = 60

# Example custom OpenAI-compatible endpoint (other Ollama tags, llama.cpp, vLLM, …):
# [model.local-llama]
# model = "llama-3"
# base_url = "http://127.0.0.1:8080/v1"
# env_key = "LOCAL_API_KEY"
# context_window = 128000
# cost_tier = 0.5
# capabilities = ["fast", "coding"]
# priority = 5

[agent]
system_prompt_label = "iomesh-tui"
# yolo = false
# workspace = ""

[iomesh]
enabled = false
# endpoint = "https://iomesh.example.com"
# tenant = "acme"
# org = "org_dev-org"       # optional: X-IOMesh-Org on MEMORY_INGEST dual-write (IOMESH_ORG / MEMORY_ORG)
# workspace = "ws_default"  # optional: X-IOMesh-Workspace (IOMESH_WORKSPACE); not [agent].workspace path
api_key_env = "IOMESH_API_KEY"
emit_dept_streams = true
context_plane = true
include_lineage = true
catalog_plane = true
# inject_catalog = false    # inject short catalog snippet each turn (or use list_mesh_catalog tool)
# policy_mode = "off"       # off | advisory | enforce (remote /v1/policy/evaluate; fail-open on transport)
# IOMESH_POLICY_MODE / IOMESH_INCLUDE_LINEAGE / IOMESH_CATALOG_PLANE / IOMESH_INJECT_CATALOG

[ui]
simple_mode = true
screen_mode = "fullscreen"
show_thinking_blocks = true
# theme = "default"   # default | mono | high-contrast | dim  (fullscreen /theme)

[features]
telemetry = false
subagents = true
codebase_indexing = true
skills = true
mcp = true

[subagents]
enabled = true
max_concurrent = 32   # parallel running children (semaphore; hard cap 128)
max_batch = 64        # max tasks per spawn_subagents call (hard cap 256)
max_depth = 2
# worktree_base = ".iomesh/worktrees"  # isolation=worktree paths
# worktree_auto_remove = false         # keep worktrees after success for inspection

# Skills: SKILL.md under .iomesh/skills/<name>/ or ~/.iomesh/skills/
[skills]
enabled = true
# dirs = ["/path/to/extra/skills"]

# Agent Plugins package wire (s1331) — opt-in; default disabled.
# package wire ≠ Agent Plugins GA · dual_write OFF · book-demo OFF
# Discover/load success ≠ Connected / install APPLY green.
# dirs: package roots (plugin.json) or parents of package roots; ~/ expanded.
# data_dir: per-plugin PLUGIN_DATA root (default: <workspace>/.iomesh/plugin-data/<name>).
# Secrets never from portable plugin fields — only ${PLUGIN_ROOT}/${PLUGIN_DATA} expand.
# Plugin MCP servers append after [[mcp.servers]] (TOML remains primary).
# [plugins]
# enabled = false
# dirs = ["~/.iomesh/plugins/my-plugin"]
# data_dir = "~/.iomesh/plugin-data"

# MCP: Model Context Protocol servers (opt-in). stdio and/or streamable HTTP.
# Tools appear as mcp__<server>__<tool>; mutating=true (default) requires approval.
[mcp]
enabled = false
# max_output_bytes = 20000
# s1267: opt-in inject X-IOMesh-Tenant/Org/Workspace on HTTP MCP (default false).
# From [iomesh] tenant/org/workspace (tenant falls back to [memory].tenant).
# Empty values not sent; never overwrites explicit headers; stdio N/A.
# inject ≠ install green · ≠ dual-auth · dual_write OFF · book-demo OFF
# inject_iomesh_context = false

# Stdio transport:
# [[mcp.servers]]
# name = "example"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-everything"]
# # env = { "API_KEY" = "from-env-preferred" }
# # enabled = true
# # mutating = true
# # startup_timeout_sec = 30
# # tool_timeout_sec = 120

# Streamable HTTP (JSON or SSE responses); URL takes precedence over command:
# [[mcp.servers]]
# name = "remote"
# url = "https://mcp.example.com/mcp"
# # headers = { "Authorization" = "Bearer …" }
# # inject_iomesh_context = true   # per-server override of [mcp] flag (s1267)
# # oauth_token_env = "MCP_TOKEN"   # static Bearer from env
# # [mcp.servers.oauth]            # or client_credentials:
# # token_url = "https://auth.example/oauth/token"
# # client_id = "iomesh"
# # client_secret_env = "MCP_CLIENT_SECRET"
# # scopes = ["mcp"]
# # allow_loopback = true
# # mutating = true

# --- Memory Palace (product edge: iomesh-memory-mcp · s1517 product-only) ---
# See docs/architecture/memory-mcp.md · Edge OSS Option A · public product attach (s1478).
# Honesty: dual_write OFF · not Memory GA · package load ≠ Memory GA · offline dogfood tip ≠ invent live dogfood as green ·
# flip complete residual ≠ invent Memory GA · public OSS ≠ invent platform GA · aion broker private ·
# PASS ≠ invent full platform sidecar parity.
#
# PUBLIC product install (no GOPRIVATE / PAT · both edge repos public):
#   go install github.com/iome-sh/iomesh-memory-mcp/cmd/iomesh-memory-mcp@main
#   go get github.com/iome-sh/memory@main
#   docker compose still valid in product repo → image iomesh-memory-mcp:local → http://127.0.0.1:8080/mcp
#   healthz: curl -fsS http://127.0.0.1:8080/healthz  (probe only · ≠ invent tool green)
# [mcp]
# enabled = true
# [[mcp.servers]]
# name = "iomesh-memory-mcp"
# url = "http://127.0.0.1:8080/mcp"
# allow_loopback = true
# mutating = true
#
# Product edge stdio alternate (same binary · no HTTP):
# # command = "iomesh-memory-mcp"
# # args = ["-palace-root", "./data/memory-palaces", "-tenant", "default"]
#
# Product [memory].server should match [[mcp.servers]].name (e.g. "iomesh-memory-mcp").
# aion cloud broker/CP stays private · no in-tree residual aion Memory sample (s1517).

# [memory] hooks: auto-recall prefers sync POST /v1/memory/retrieve when [iomesh]
# is enabled or endpoint (sidecar) is set; falls back to MCP server above.
# Optional dual_write also publishes async MEMORY_INGEST when [iomesh] is enabled.
# [memory]
# enabled = true
# server = "iomesh-memory-mcp"
# tenant = "dept.research"
# endpoint = "http://127.0.0.1:8765"  # memory sidecar (stage warm plane); IOMESH_MEMORY_ENDPOINT
# auto_recall = true     # inject <memory-context> each turn (fail-open; sync then MCP)
# auto_ingest = false    # opt-in: persist user+assistant after successful turn
# dual_write = false     # opt-in audit only: mesh MEMORY_INGEST (IOMESH_MEMORY_DUAL_WRITE=1); not primary palace
# pull_stream = "EVENTS" # iomesh memory pull — durable stream (s652 cost-max M1)
# pull_consumer = "tui-local-palace"
# pull_filter = ""
# pull_batch = 8
# pull_max_wait_ms = 2000
# pull_role = ""           # optional X-IOMesh-Role on mesh auth (s675 Beta; fail-open empty; s678 role-aware default filter)
# pull_allow_suffix = ""   # optional X-IOMesh-Pull-Allow-Suffix (role=custom comma tokens; s678 single-token default filter)
# limit = 8
# max_snippet_bytes = 6000
# recall_since = ""          # optional RFC3339 auto-recall lower bound (s1068 temporal retrieve)
# recall_until = ""          # optional RFC3339 auto-recall upper bound
# recall_session_seq
# recall_cache_ttl_ms = 3000  # s1069 short-TTL sync cache; 0 disables = 0     # optional session_seq filter; 0 omits from body
# IOMESH_MEMORY=1 · IOMESH_MEMORY_TENANT · IOMESH_MEMORY_ENDPOINT · MEMORY_SIDECAR_URL
# IOMESH_MEMORY_AUTO_RECALL · IOMESH_MEMORY_AUTO_INGEST · IOMESH_MEMORY_DUAL_WRITE
# IOMESH_MEMORY_RECALL_SINCE · IOMESH_MEMORY_RECALL_UNTIL · IOMESH_MEMORY_RECALL_SESSION_SEQ
# IOMESH_MEMORY_PULL_ROLE · IOMESH_MEMORY_PULL_ALLOW_SUFFIX
