name: Bug report
description: Something is broken or unexpected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not include API keys, tokens, or private repo paths.**
        Security issues → private advisory or security@iome.sh (see SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps, CLI flags, and (if safe) config snippets with secrets redacted.
      placeholder: |
        1. export DEEPSEEK_API_KEY=…
        2. ./bin/iomesh -p "…"
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `iomesh version` or `git rev-parse --short HEAD`
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version
      placeholder: go1.26.5
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
        - Other
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `make check` (or CI) and this still reproduces
        - label: I redacted secrets from logs/config pasted here
